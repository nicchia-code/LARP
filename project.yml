name: LARP

options:
  bundleIdPrefix: com.larp
  developmentLanguage: it
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Apple silicon only (M1 and later).
    ARCHS: arm64
    EXCLUDE_ARCHS: x86_64
    ONLY_ACTIVE_ARCH: NO
    # Signed for local execution only: ad-hoc by default. To use a personal team,
    # set CODE_SIGN_STYLE: Automatic, CODE_SIGN_IDENTITY: "Apple Development"
    # and DEVELOPMENT_TEAM: <team id> (see README.md).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.7
  # WebRTC's audio processing module, built from source (see its README.md): used only for
  # its echo canceller, AEC3. Pinned to one revision of WebRTC, which lives in the package.
  WebRTCAudioProcessing:
    path: Packages/WebRTCAudioProcessing

targets:
  LARP:
    type: application
    platform: macOS
    # Folder-based: every file added under Sources/LARP is picked up
    # automatically, no need to edit this file.
    sources:
      - path: Sources/LARP
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: WebRTCAudioProcessing
        product: WebRTCAudioProcessing
    settings:
      base:
        PRODUCT_NAME: LARP
        PRODUCT_BUNDLE_IDENTIFIER: com.larp.LARP
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDevelopmentRegion: it
        CFBundleDisplayName: LARP
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSMicrophoneUsageDescription: "LARP usa il microfono per registrare la tua voce durante le call. L'audio resta sul tuo Mac e non viene mai inviato a nessun servizio esterno."
        NSAudioCaptureUsageDescription: "LARP registra l'audio di sistema per catturare la voce degli altri partecipanti alle call. L'audio resta sul tuo Mac e non viene mai inviato a nessun servizio esterno."
    entitlements:
      path: Config/LARP.entitlements
      properties:
        # Not sandboxed: needed for the Core Audio process taps and free access
        # to ~/Library/Application Support/LARP/.
        com.apple.security.app-sandbox: false

  LARPTests:
    type: bundle.unit-test
    platform: macOS
    # Folder-based: every Swift Testing file added under Tests/LARPTests is
    # picked up automatically, no need to edit this file. Tests run inside the
    # LARP app (`@testable import LARP`). Tests that need speech models,
    # FluidAudio models, the microphone or system audio carry the tag
    # `.requiresHardware`; Tests/LARP.xctestplan skips it (CI). The plan refers
    # to this target by its generated identifier: if the target is renamed,
    # update `identifier` in the plan (see `BlueprintIdentifier` in the scheme).
    sources:
      - path: Tests/LARPTests
    dependencies:
      - target: LARP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.larp.LARPTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  LARP:
    build:
      targets:
        LARP: all
        LARPTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # The plan skips the tests tagged `.requiresHardware` (see Tests/LARPTests/Tags.swift).
      testPlans:
        - path: Tests/LARP.xctestplan
          defaultPlan: true
    profile:
      config: Release
    archive:
      config: Release
