languages:
  - name: Swift
    version: "6"
frameworks:
  - name: SwiftUI
  - name: Speech (SpeechAnalyzer)
    version: macOS 26
    note: on-device transcription with SpeechTranscriber, Italian and English
  - name: Core Audio process taps
    chosenByAgent: captures the system audio of every call app with only the system audio recording permission, without screen recording
  - name: AVFoundation
    chosenByAgent: standard API for microphone capture, audio files and playback
  - name: FluidAudio
    note: on-device speaker diarization on Core ML
  - name: ServiceManagement
    chosenByAgent: SMAppService is the system API for launch at login
  - name: XcodeGen
    chosenByAgent: keeps the Xcode project as a readable, versioned project.yml
  - name: omp (Agent Client Protocol)
    note: transcript refinement through the omp installed by the user, started as `omp acp` over stdio with the model configured in omp; not bundled with the app
data:
  - name: SwiftData
    note: archive of calls, transcript lines and participants, in Application Support
testing:
  - name: Swift Testing
ci:
  - name: GitHub Actions
    note: on a macos-26 runner; build and test on every push and pull request; on every vX.Y.Z tag, test, build the Release configuration, package a DMG and publish a GitHub Release
    chosenByAgent: macos-26 is the GitHub runner image with Xcode for macOS 26
repository:
  - name: GitHub
    note: private repository; the trusted people who install the app are read-only collaborators
deployment:
  - name: Local Xcode build
    note: development builds, built and run on the developer's own Mac
  - name: GitHub Releases
    note: one Release per vX.Y.Z tag with an ad-hoc signed DMG made with hdiutil, for the developer's Macs and a few trusted people; no notarization, no public distribution, manual updates
notes: |
  Target: Apple silicon Macs (M1 and later) with macOS 26 or later.
  No cloud and no infrastructure files: everything runs on the Mac, except transcript refinement, where omp sends the text of the transcript (never the audio) to the model provider configured in omp.
